name: bot-precos

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-precos
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar um ciclo do bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: python main.py

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "bot-precos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/estado.bin
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -q -m "estado do bot"
            git pull -q --rebase
            git push -q
          fi
